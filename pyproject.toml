[build-system]  
requires = ["setuptools>=68.0", "wheel"]  
build-backend = "setuptools.build_meta"  

[project] 
name = "BioPaster"  
version = "0.1.0" 
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
include = ["biopaster*"]

[project.scripts]  
biopaster = "biopaster.cli:main"