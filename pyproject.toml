[build-system]  
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"  

[project] 
name = "BioPaster"  
version = "0.1.0" 
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "anthropic==0.97.0",
    "requests==2.34.2",
    "ddgs==9.14.4",
    "beautifulsoup4==4.15.0",
    "markdownify==1.2.3",
    "playwright==1.62.0",
    "Pillow==12.3.0",
    "pypdfium2==5.13.0",
    "nbformat==5.11.1",
    "nbclient==0.11.0",
    "ipykernel==7.3.0",
    "jupyter-client==8.10.0",
    "prompt-toolkit==3.0.53",
    "rich==13.9.4",
    "tree-sitter==0.26.0",
    "tree-sitter-bash==0.25.1",
    "mcp==1.29.0",
    "anyio==4.13.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pydantic==2.13.3",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["biopaster*"]

[project.scripts]  
biopaster = "biopaster.cli:main"
